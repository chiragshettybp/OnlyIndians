outline": "#737686" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "3xl": "2.5rem", "lg": "1.25rem", "md": "1rem", "margin-page": "1.25rem", "sm": "0.75rem", "gutter-desktop": "1.5rem", "xs": "0.5rem", "gutter-mobile": "1rem", "max-width-content": "72rem", "2xl": "2rem", "2xs": "0.25rem", "xl": "1.5rem" }, fontFamily: { "headline": ["Inter"], "caption-1": ["Inter"], "large-title": ["Inter"], "callout": ["Inter"], "body": ["Inter"], "large-title-mobile": ["Inter"], "subheadline": ["Inter"], "title-3": ["Inter"], "title-2": ["Inter"], "footnote": ["Inter"], "title-1": ["Inter"], "caption-2": ["Inter"] }, fontSize: { "headline": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "600" }], "caption-1": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }], "large-title": ["34px", { lineHeight: "41px", letterSpacing: "-0.022em", fontWeight: "700" }], "callout": ["16px", { lineHeight: "21px", letterSpacing: "-0.005em", fontWeight: "400" }], "body": ["17px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "400" }], "large-title-mobile": ["28px", { lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "700" }], "subheadline": ["15px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }], "title-3": ["20px", { lineHeight: "25px", letterSpacing: "-0.01em", fontWeight: "600" }], "title-2": ["22px", { lineHeight: "28px", letterSpacing: "-0.015em", fontWeight: "600" }], "footnote": ["13px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }], "title-1": ["28px", { lineHeight: "34px", letterSpacing: "-0.02em", fontWeight: "700" }], "caption-2": ["11px", { lineHeight: "13px", letterSpacing: "0.03em", fontWeight: "600" }] } } } };</script></head><body class="bg-surface font-body text-body text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full bg-surface px-margin-page flex-grow"><div class="flex flex-col w-full pb-8">
<!-- Cupertino Header Bar -->
<header class="w-full flex items-center justify-between py-3 mb-2">
<button class="inline-flex items-center gap-1 text-primary active:opacity-60 transition-opacity min-h-[44px] -ml-1" type="button">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
<span class="font-body text-body font-medium">Back</span>
</button>
<span class="font-headline text-headline text-on-surface">Claim Handle</span>
<button class="font-body text-body text-primary font-medium active:opacity-60 transition-opacity min-h-[44px] flex items-center pr-1" type="button">
      Help
    </button>
</header>
<!-- 5-Segment Native Progress Bar (Step 5 of 5) -->
<div class="w-full mb-6">
<div class="flex items-center justify-between mb-2">
<span class="font-caption-1 text-caption-1 text-on-surface-variant font-medium uppercase tracking-wider">Step 5 of 5</span>
<span class="font-caption-1 text-caption-1 text-primary font-semibold">100% Completed</span>
</div>
<div class="grid grid-cols-5 gap-1.5 w-full">
<div class="h-1 rounded-full bg-primary"></div>
<div class="h-1 rounded-full bg-primary"></div>
<div class="h-1 rounded-full bg-primary"></div>
<div class="h-1 rounded-full bg-primary"></div>
<div class="h-1 rounded-full bg-primary"></div>
</div>
</div>
<!-- Main Hero Title Group -->
<div class="flex flex-col gap-1.5 mb-6">
<h1 class="font-large-title-mobile text-large-title-mobile text-on-surface font-bold tracking-tight">
      Claim Your @username
    </h1>
<p class="font-subheadline text-subheadline text-on-surface-variant leading-relaxed">
      Your unique identifier across creator subscriber lists, badges, and discussions.
    </p>
</div>
<!-- Section 1: Handle Input & Live Validation -->
<section class="w-full mb-5">
<div class="bg-surface-container-lowest rounded-2xl shadow-sm p-4 flex flex-col gap-3">
<label class="font-caption-1 text-caption-1 font-semibold uppercase tracking-wider text-on-surface-variant" for="handle-input">
        Subscriber Handle
      </label>
<!-- Input Container with fixed @ symbol -->
<div class="relative flex items-center bg-surface-container-low rounded-xl px-3.5 py-2.5 transition-all focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#2563eb]">
<span class="font-headline text-headline text-on-surface-variant select-none mr-0.5">@</span>
<input autocapitalize="none" autocomplete="off" class="w-full bg-transparent font-headline text-headline text-on-surface placeholder:text-outline focus:outline-none tracking-tight" id="handle-input" maxlength="20" placeholder="yourname" spellcheck="false" type="text" value="aarav">
<button aria-label="Clear handle input" class="text-outline hover:text-on-surface-variant p-1 rounded-full flex items-center justify-center transition-colors" id="clear-btn" type="button">
<span class="material-symbols-outlined text-[18px]">cancel</span>
</button>
</div>
<!-- Real-time Status Indicator Pill -->
<div class="flex items-center self-start gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 transition-all" id="status-pill">
<span class="material-symbols-outlined text-[16px] text-emerald-700">check_circle</span>
<span class="font-caption-1 text-caption-1 font-semibold tracking-wide">
          @<span id="status-handle" class="">aarav</span> is available
        </span>
</div>
<p class="font-footnote text-footnote text-on-surface-variant pt-0.5">
        Only letters, numbers, and underscores. 3–20 characters.
      </p>
</div>
</section>
<!-- Section 2: Suggested Available Alternatives -->
<section class="w-full mb-5">
<div class="bg-surface-container-lowest rounded-2xl shadow-sm p-4 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-caption-1 text-caption-1 font-semibold uppercase tracking-wider text-on-surface-variant">
          Suggested Alternatives
        </span>
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">auto_awesome</span>
</div>
<div class="flex flex-wrap gap-2 pt-0.5" id="suggestions-group">
<button class="suggestion-chip group inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-surface-container-low hover:bg-surface-container active:scale-[0.97] transition-all text-left" type="button">
<span class="material-symbols-outlined text-[16px] text-primary">add</span>
<span class="font-subheadline text-subheadline text-on-surface font-medium">@aarav_sharma</span>
</button>
<button class="suggestion-chip group inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-surface-container-low hover:bg-surface-container active:scale-[0.97] transition-all text-left" type="button">
<span class="material-symbols-outlined text-[16px] text-primary">add</span>
<span class="font-subheadline text-subheadline text-on-surface font-medium">@aarav.in</span>
</button>
<button class="suggestion-chip group inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-surface-container-low hover:bg-surface-container active:scale-[0.97] transition-all text-left" type="button">
<span class="material-symbols-outlined text-[16px] text-primary">add</span>
<span class="font-subheadline text-subheadline text-on-surface font-medium">@aarav_official</span>
</button>
</div>
</div>
</section>
<!-- Section 3: Identity Badge Preview Card -->

<!-- Sticky Bottom CTAs -->
<div class="w-full flex flex-col gap-2.5 pt-2">
<button class="w-full h-[50px] rounded-full bg-[#2563eb] text-white font-headline text-headline flex items-center justify-center gap-2 font-semibold shadow-md active:scale-[0.98] transition-transform" id="submit-handle-btn" type="button">
<span class="">Claim Username &amp; Complete Setup</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="w-full h-[48px] rounded-full bg-transparent text-on-surface-variant hover:text-on-surface font-body text-body font-medium flex items-center justify-center active:opacity-60 transition-opacity" type="button">
      Decide Later
    </button>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('handle-input');
    const previewHandle = document.getElementById('preview-handle');
    const statusHandle = document.getElementById('status-handle');
    const clearBtn = document.getElementById('clear-btn');
    const statusPill = document.getElementById('status-pill');
    const chips = document.querySelectorAll('.suggestion-chip');

    function sanitize(val) {
      return val.replace(/[^a-zA-Z0-9_.]/g, '').toLowerCase();
    }

    function updatePreview(val) {
      const clean = sanitize(val) || 'username';
      previewHandle.textContent = '@' + clean;
      statusHandle.textContent = clean;
    }

    if (input) {
      input.addEventListener('input', (e) => {
        const clean = sanitize(e.target.value);
        e.target.value = clean;
        updatePreview(clean);
        
        if (clean.length >= 3) {
          statusPill.className = 'flex items-center self-start gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-800 transition-all';
          statusPill.innerHTML = '<span class="material-symbols-outlined text-[16px] text-emerald-700">check_circle</span><span class="font-caption-1 text-caption-1 font-semibold tracking-wide">@' + clean + ' is available</span>';
        } else {
          statusPill.className = 'flex items-center self-start gap-1.5 px-3 py-1 rounded-full bg-surface-container text-on-surface-variant transition-all';
          statusPill.innerHTML = '<span class="material-symbols-outlined text-[16px]">info</span><span class="font-caption-1 text-caption-1 font-semibold tracking-wide">Must be at least 3 characters</span>';
        }
      });
    }

    if (clearBtn && input) {
      clearBtn.addEventListener('click', () => {
        input.value = '';
        input.focus();
        updatePreview('');
      });
    }

    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        const text = chip.querySelector('span:last-child').textContent.replace('@', '');
        if (input) {
          input.value = text;
          updatePreview(text);
          input.focus();
        }
      });
    });
  })();
</script></main>

</body></html>
